name: 블로그 원고 (월·수·금)

on:
  schedule:
    # 21:00 UTC 일·화·목 = 06:00 KST 월·수·금. 첫 예약 발행(08:30) 전에 원고가 오도록.
    - cron: "0 21 * * 0,2,4"
  workflow_dispatch:
    inputs:
      max:
        description: "이번에 보낼 원고 수 상한"
        type: string
        default: "3"
      only:
        description: "이 별칭만 (쉼표로 여러 명)"
        type: string
        default: ""

permissions:
  contents: write # data/ 자동 커밋용

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # 썸네일 카드에 한글을 그리려면 한글 글꼴이 있어야 한다 (없으면 썸네일만 생략)
      - run: sudo apt-get install -y -qq fonts-nanum
      - name: 원고 만들기·보내기
        env:
          TZ: Asia/Seoul
          ODCLOUD_SERVICE_KEY: ${{ secrets.ODCLOUD_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOG_TO: ${{ secrets.BLOG_TO }}
          ONLY: ${{ inputs.only }}
          MAX: ${{ inputs.max || '3' }}
        run: python -m src.main --max "$MAX" ${ONLY:+--only "$ONLY"}
      - name: 발송 이력·캐시 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then echo "변경 없음"; else
            git commit -m "chore: 원고 이력 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
